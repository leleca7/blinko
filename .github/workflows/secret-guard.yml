name: Blinko · proteção de credenciais

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Bloquear arquivos .env com valores reais
        shell: bash
        run: |
          set -euo pipefail
          files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.(example|sample|template)$' || true)"
          if [ -n "$files" ]; then
            echo "::error::Arquivos de ambiente com segredos rastreados no Git:"
            echo "$files"
            exit 1
          fi
      - name: Procurar padrões de credenciais expostas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          patterns = {
              "OpenAI API key": re.compile(r"\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b"),
              "GitHub personal token": re.compile(r"\bgh[oprsu]_[A-Za-z0-9]{20,}\b"),
              "Google API key": re.compile(r"\bAIza[0-9A-Za-z_-]{30,}\b"),
              "Private key block": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "Vercel token literal": re.compile(r"VERCEL_TOKEN\s*[:=]\s*['\"][^'\"]+['\"]", re.I),
              "Database URL literal": re.compile(r"postgres(?:ql)?://[^\s'\"]+:[^\s'\"]+@", re.I),
              "Neon connection string literal": re.compile(r"(?:DATABASE_URL|NEON_DATABASE_URL)\s*[:=]\s*['\"]postgres(?:ql)?://", re.I),
          }

          violations = []
          filenames = subprocess.check_output(["git","ls-files","-z"]).decode().split("\0")
          for name in filenames:
              if not name or name.endswith((".png",".jpg",".jpeg",".webp",".ico",".woff",".woff2",".pdf",".svg")):
                  continue
              try:
                  data = Path(name).read_bytes()
                  if b"\0" in data[:8192]:
                      continue
                  text = data.decode("utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              for kind, pattern in patterns.items():
                  if pattern.search(text):
                      violations.append(f"{name}: {kind}")
          if violations:
              raise SystemExit("Possíveis segredos no repositório:\n" + "\n".join(violations))
          print("Secret guard: nenhum padrão detectado (não substitui revisão de credenciais).")
          PY
