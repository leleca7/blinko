name: Blinko OS - sandbox acceptance
on:
  push:
    branches:
      - preview/blinko-os-fase1-20261124
    paths:
      - "app/os-preview/**"
      - "app/os-workspace/**"
      - "app/api/os-lab/**"
      - "database/sandbox/**"
      - "lib/os-lab/**"
      - "tests/os-lab*"
      - ".github/workflows/os-lab-acceptance.yml"
      - "package.json"
      - "proxy.ts"
      - "tsconfig.os-lab.json"
permissions:
  contents: read
concurrency:
  group: blinko-os-sandbox-acceptance
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BLINKO_OS_LAB_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pure unit tests
        run: node --experimental-strip-types --test tests/os-lab-*.test.mjs
      - name: Install project and browser runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run isolated local browser test
        shell: bash
        run: |
          mkdir -p test-artifacts
          npm run dev -- --hostname 127.0.0.1 --port 3210 >test-artifacts/next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent --max-time 10 http://127.0.0.1:3210/os-preview >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --max-time 30 http://127.0.0.1:3210/os-preview >/dev/null
          node tests/os-lab-browser.mjs
      - name: Typecheck connected workspace and API
        run: npx tsc --project tsconfig.os-lab.json
      - name: Upload synthetic test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinko-os-sandbox-test
          path: test-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  database-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sandbox_owner
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: blinko_sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sandbox_owner -d blinko_sandbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Apply every migration and run synthetic lifecycle
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: sandbox_owner
          PGPASSWORD: synthetic-ci-only
          PGDATABASE: blinko_sandbox
        run: |
          set -euo pipefail
          for migration in database/sandbox/[0-9][0-9][0-9]_*.sql; do
            echo "Applying $migration"
            psql -X -v ON_ERROR_STOP=1 -1 -f "$migration"
          done
          psql -X -v ON_ERROR_STOP=1 -f tests/os-lab-integration.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/os-lab-auth-integration.sql
