name: Blinko OS - sandbox acceptance
on:
  push:
    branches:
      - preview/blinko-os-fase1-20261124
    paths:
      - "app/os-preview/**"
      - "app/os-workspace/**"
      - "app/api/os-lab/**"
      - "database/sandbox/**"
      - "lib/os-lab/**"
      - "tests/os-lab*"
      - ".github/workflows/os-lab-acceptance.yml"
      - "package.json"
      - "proxy.ts"
      - "tsconfig.os-lab.json"
permissions:
  contents: read
concurrency:
  group: blinko-os-sandbox-acceptance
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BLINKO_OS_LAB_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pure unit tests
        run: node --experimental-strip-types --test tests/os-lab-*.test.mjs
      - name: Install project and browser runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run isolated local browser test
        shell: bash
        run: |
          mkdir -p test-artifacts
          npm run dev -- --hostname 127.0.0.1 --port 3210 >test-artifacts/next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent --max-time 10 http://127.0.0.1:3210/os-preview >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --max-time 30 http://127.0.0.1:3210/os-preview >/dev/null
          node tests/os-lab-browser.mjs
      - name: Typecheck connected workspace and API
        run: npx tsc --project tsconfig.os-lab.json
      - name: Upload synthetic test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinko-os-sandbox-test
          path: test-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  database-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sandbox_owner
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: blinko_sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sandbox_owner -d blinko_sandbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Apply every migration and run synthetic lifecycle
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: sandbox_owner
          PGPASSWORD: synthetic-ci-only
          PGDATABASE: blinko_sandbox
        run: |
          set -euo pipefail
          for migration in database/sandbox/[0-9][0-9][0-9]_*.sql; do
            echo "Applying $migration"
            psql -X -v ON_ERROR_STOP=1 -1 -f "$migration"
          done
          psql -X -v ON_ERROR_STOP=1 -f tests/os-lab-integration.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/os-lab-auth-integration.sql

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Authenticated HTTP test in disposable local checkout
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGUSER: sandbox_owner
          PGPASSWORD: synthetic-ci-only
          PGDATABASE: blinko_sandbox
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          TEST_DIR="$(mktemp -d)"
          trap 'if [ -n "${SERVER_PID:-}" ]; then kill "$SERVER_PID" 2>/dev/null || true; fi; rm -rf "$TEST_DIR"' EXIT
          git archive HEAD | tar -x -C "$TEST_DIR"
          cd "$TEST_DIR"
          export BLINKO_CI_DISPOSABLE=yes
          export BLINKO_OS_LAB_ENABLED=true
          export BLINKO_OS_LAB_ORIGIN=https://localhost:3211
          export BLINKO_OS_LAB_SESSION_SECRET="$(openssl rand -hex 32)"
          export BLINKO_OS_LAB_DATABASE_URL='postgresql://os_lab_runtime:synthetic-ci-only@ep-old-art-bbztkcnw.c-15.us-east-1.aws.neon.tech/blinko_sandbox?sslmode=require'
          export BLINKO_OS_LAB_ISSUER_URL='postgresql://os_lab_issuer:synthetic-ci-only@ep-old-art-bbztkcnw.c-15.us-east-1.aws.neon.tech/blinko_sandbox?sslmode=require'
          unset VERCEL_ENV
          # Only the local disposable service receives login-enabled roles.
          psql -X -v ON_ERROR_STOP=1 -c "ALTER ROLE os_lab_runtime LOGIN PASSWORD 'synthetic-ci-only'; ALTER ROLE os_lab_issuer LOGIN PASSWORD 'synthetic-ci-only';"
          cp tests/os-lab-ci-pg-adapter.mjs lib/os-lab/ci-pg-adapter.mjs
          python3 - <<'PY'
          from pathlib import Path
          for filename in ['lib/os-lab/auth.ts','lib/os-lab/repository.ts']:
              p=Path(filename)
              s=p.read_text()
              assert '@neondatabase/serverless' in s
              p.write_text(s.replace('@neondatabase/serverless','./ci-pg-adapter.mjs'))
          # Diagnostic logs only in the throwaway copy: no tokens, cookies or bodies.
          p=Path('app/api/os-lab/session/route.ts')
          s=p.read_text()
          anchor=' const origin=process.env.BLINKO_OS_LAB_ORIGIN;'
          assert anchor in s
          p.write_text(s.replace(anchor,anchor+'\\n console.info("CI origin check", {expected:origin, received:request.headers.get("origin"), actual:request.nextUrl.origin});'))
          p=Path('proxy.ts')
          s=p.read_text()
          anchor='  const pathname = request.nextUrl.pathname;'
          assert anchor in s
          p.write_text(s.replace(anchor,anchor+'\n  if (["/os-workspace","/os-workspace/login","/api/os-lab/projects","/api/os-lab/session"].includes(pathname)) return NextResponse.next();'))
          PY
          npm install --no-save --package-lock=false playwright@1.56.1 pg@8
          npx playwright install --with-deps chromium
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ci-key.pem -out ci-cert.pem -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          npm run dev -- --hostname 127.0.0.1 --port 3211 --experimental-https --experimental-https-key ci-key.pem --experimental-https-cert ci-cert.pem >ci-next.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if curl -kf --silent --max-time 5 https://localhost:3211/os-workspace/login >/dev/null; then break; fi
            sleep 2
          done
          curl -kf --silent --max-time 30 https://localhost:3211/os-workspace/login >/dev/null || { tail -80 ci-next.log; exit 1; }
          node tests/os-lab-http.mjs || { tail -80 ci-next.log; exit 1; }
